# ERNIE-Image 引擎包定义（v0.3.0 ComfyUI 子进程模式）
# 说明：
#   - 这是引擎自身的 Python 包元信息
#   - 让 `python -m engines.ernie_image_909469ed.server` 能正确解析包结构
#   - 引擎运行依赖由 envs/image-ernie-comfyui/ 提供（含 ComfyUI + ComfyUI-GGUF），
#     这里不重复声明，避免双重锁定版本

[project]
name = "ernie-image-engine"
version = "1.0.0"
description = "AIReliable ERNIE-Image 引擎（ComfyUI 子进程模式，v0.3.0 推倒重来）"
requires-python = ">=3.10,<3.12"

# 引擎运行依赖在 envs/image-ernie-comfyui/pyproject.toml 中声明
# 主要依赖（仅供参考，实际版本以 envs/image-ernie-comfyui/pyproject.toml 为准）：
#   - torch >= 2.7.0（CUDA 12.8+，ComfyUI v0.32.0 要求）
#   - httpx（ComfyUI HTTP 客户端）
#   - websockets（ComfyUI WebSocket 事件订阅）
#   - fastapi + uvicorn（引擎 HTTP 服务）
#   - PyYAML（manifest.yaml 解析）
#   - pydantic（数据模型）
#   - aireliable-engine-sdk >= 0.3.0（平台 SDK，CustomEngine 基类 + PlatformVramManager）
#   - ComfyUI v0.32.0（envs/image-ernie-comfyui/ComfyUI/，子进程模式启动）
#   - ComfyUI-GGUF（Randy420Marsh fork，ERNIE-Image arch 支持）
# 这里不重复声明，避免双重锁定版本
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engines"]
