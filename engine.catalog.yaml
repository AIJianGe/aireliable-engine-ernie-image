description_long:
  zh: |-
    ERNIE-Image 通过 ComfyUI 子进程承载推理，再由 AIReliable 统一封装为标准的图像生成引擎，对外接口与其他图像引擎一致。

    目录提供 GGUF Q4 与 Turbo 两档：Q4 显存占用更低、适合中低显存设备；Turbo 用更少的采样步数换取更快的出图，适合草图与批量试色。

    引擎负责 ComfyUI 进程的启动、端口分配、任务排队与异常重启，用户无需单独维护 ComfyUI 环境。建议使用 NVIDIA GPU 并预留充足显存。
  en: |-
    ERNIE-Image runs inference inside a ComfyUI subprocess and is wrapped by AIReliable as a standard image-generation engine, so its API matches the other image engines.

    Two tiers are offered: GGUF Q4 lowers VRAM usage for mid-range cards, while Turbo trades sampling steps for faster output and suits drafts and batch colour exploration.

    The engine manages the ComfyUI process lifecycle, port assignment, task queuing and restart-on-failure, so no separate ComfyUI environment is needed. An NVIDIA GPU with sufficient VRAM is recommended.
